<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DidactIA - Acceso para Docentes</title>
    <meta name="description" content="Accede a DidactIA, el asistente inteligente para docentes de secundaria en México.">
    <link rel="icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C212E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DidactIA">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="auth.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>
<body>

<!-- Partículas de fondo -->
<div class="particles" id="particles"></div>

<div class="auth-container">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <img src="logo.png" alt="DidactIA Logo">
            <span class="auth-logo-text">DidactIA</span>
        </div>
        <p class="auth-subtitle">Asistente inteligente para <strong>docentes de secundaria</strong></p>

        <!-- Mensaje de estado -->
        <div class="auth-message" id="auth-message">
            <span id="auth-message-text"></span>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login" style="width: 100%; pointer-events: none;">Iniciar Sesión</button>
        </div>

        <!-- Formulario Login -->
        <form class="auth-form visible" id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="login-email" class="form-input" placeholder="profe@escuela.edu.mx" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="Tu contraseña" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('login-password')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="auth-btn" id="login-btn">
                <span class="btn-text">Iniciar Sesión →</span>
                <div class="spinner"></div>
            </button>
        </form>


        <!-- Divisor -->
        <div class="auth-divider">
            <span>O continúa con</span>
        </div>

        <!-- Google Login -->
        <button class="google-btn" id="google-btn" onclick="handleGoogleLogin()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span class="btn-text">Continuar con Google</span>
            <div class="spinner"></div>
        </button>

        <div class="auth-footer">
            <p>Al registrarte, aceptas nuestros <a href="legal.html" style="color:#818cf8; text-decoration:none;">Términos de Uso y Privacidad</a> 📚</p>
            <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
                <button onclick="window.location.href='admin.html'" style="background:transparent; border:1px solid #6366f1; color:#6366f1; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; transition:0.3s;">
                    🔐 Acceso Administrativo
                </button>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword,
        onAuthStateChanged,
        updateProfile,
        setPersistence,
        browserSessionPersistence,
        sendPasswordResetEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Redirigir si ya está logueado
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = 'index.html';
        }
    });

    // Generar partículas
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 3;
        p.style.cssText = `
            width: ${size}px; height: ${size}px;
            left: ${Math.random() * 100}%;
            animation-duration: ${Math.random() * 15 + 12}s;
            animation-delay: ${Math.random() * 10}s;
            background: ${Math.random() > 0.5 ? '#4F6EF7' : '#7C3AED'};
        `;
        particlesEl.appendChild(p);
    }

    // Exponer funciones al window
    window.switchTab = (tab) => {
        // Obsoleto, pero se mantiene para no romper adminQuickLogin
        hideMessage();
    };

    window.togglePassword = (id) => {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    };



    window.adminQuickLogin = () => {
        switchTab('login');
        document.getElementById('login-email').value = "";
        document.getElementById('login-email').focus();
        showMessage('info', 'Por favor, ingresa tus credenciales de administrador.');
    };



    function showMessage(type, text) {
        const el = document.getElementById('auth-message');
        const textEl = document.getElementById('auth-message-text');
        el.className = `auth-message ${type} visible`;
        textEl.textContent = text;
    }

    function hideMessage() {
        document.getElementById('auth-message').className = 'auth-message';
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.classList.toggle('loading', loading);
        btn.disabled = loading;
    }

    window.handleResetPassword = async () => {
        const email = document.getElementById('login-email').value.trim();
        if (!email) {
            return showMessage('error', '⚠️ Por favor, ingresa tu correo para enviarte el enlace de recuperación.');
        }
        try {
            await sendPasswordResetEmail(auth, email);
            showMessage('success', '📧 ¡Enviado! Revisa tu bandeja de entrada (y la carpeta de Spam).');
        } catch (err) {
            console.error(err);
            showMessage('error', '⚠️ Error: ' + err.message);
        }
    };

    window.handleGoogleLogin = async () => {
        const provider = new GoogleAuthProvider();
        try {
            setLoading('google-btn', true);
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            
            // Verificamos si ya existe en Firestore
            const userDocRef = doc(db, "usuarios", user.uid);
            const userDoc = await getDoc(userDocRef);
            
            if (!userDoc.exists()) {
                // Si el correo ya existe en otro documento (usuario de contraseña), vinculamos
                // (Firebase maneja la vinculación de cuenta si está configurado, 
                // pero aquí nos aseguramos de que el registro en Firestore sea consistente)
                await setDoc(userDocRef, {
                    nombre: user.displayName || "Docente DidactIA",
                    nickname: (user.displayName || "Docente").split(' ')[0],
                    email: user.email,
                    fotoPerfil: user.photoURL || "",
                    proveedor: "google",
                    creditos: 1,
                    plan: "gratis",
                    fechaRegistro: new Date().toISOString(),
                    uid: user.uid
                });

                // Send Welcome Email via Vercel Function
                fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: user.email,
                        subject: '¡Bienvenido a DidactIA! 🍎',
                        html: `<div style="font-family:sans-serif; padding:20px; text-align:center;">
                            <h2>¡Hola, ${(user.displayName || "Docente").split(' ')[0]}!</h2>
                            <p>Te damos la bienvenida a <strong>DidactIA</strong>, tu asistente de planeaciones.</p>
                            <p>Hemos añadido <strong>1 crédito de regalo</strong> a tu cuenta para que pruebes nuestra tecnología.</p>
                            <p>¡Esperamos que te sea de muchísima utilidad!</p>
                            <a href="https://didactia.app" style="display:inline-block; padding:10px 20px; background:#4F46E5; color:white; text-decoration:none; border-radius:5px; margin-top:20px;">Comenzar a planear</a>
                        </div>`
                    })
                }).catch(err => console.error("Error enviando bienvenida:", err));

            } else {
                // Si ya existe, actualizamos solo la foto si cambió
                await setDoc(userDocRef, { 
                    fotoPerfil: user.photoURL || userDoc.data().fotoPerfil || "" 
                }, { merge: true });
            }
            
            // Analytics
            if (typeof gtag === 'function') gtag('event', 'login_success', { 'method': 'google' });

            showMessage('success', `🎉 ¡Bienvenido/a, ${user.displayName}! Entrando...`);
            setTimeout(() => window.location.href = 'index.html', 1000);
        } catch (err) {
            console.error(err);
            if (err.code === 'auth/account-exists-with-different-credential') {
                showMessage('error', '⚠️ Ya existe una cuenta con este correo pero con otro método de inicio de sesión.');
            } else {
                showMessage('error', '⚠️ Error al conectar con Google: ' + err.message);
            }
            setLoading('google-btn', false);
        }
    };

    window.handleLogin = async (e) => {
        e.preventDefault();
        hideMessage();
        setLoading('login-btn', true);
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        try {
            // Aplicar persistencia de sesión (se cierra al cerrar la pestaña)
            await setPersistence(auth, browserSessionPersistence);
            const userCred = await signInWithEmailAndPassword(auth, email, password);
            // No seteamos nada localmente aquí; dejaremos que index.html recupere el displayName real de la nube
            showMessage('success', '✅ ¡Bienvenido! Entrando a DidactIA...');
            setTimeout(() => window.location.href = 'index.html', 1000);
        } catch (err) {
            console.error(err);
            const msgs = {
                'auth/user-not-found': 'No existe una cuenta con ese correo.',
                'auth/wrong-password': 'Contraseña incorrecta. Inténtalo de nuevo.',
                'auth/invalid-email': 'El correo no es válido.',
                'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
                'auth/invalid-credential': 'Correo o contraseña incorrectos.'
            };
            showMessage('error', '⚠️ ' + (msgs[err.code] || 'Error al iniciar sesión. Detalle: ' + err.message));
            setLoading('login-btn', false);
        }
    };

    window.handleRegister = async (e) => {
        e.preventDefault();
        hideMessage();
        setLoading('register-btn', true);
        const name = document.getElementById('reg-name').value.trim();
        const nickname = document.getElementById('reg-nickname').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        try {
            // Aplicar persistencia de sesión tb al registrarse
            await setPersistence(auth, browserSessionPersistence);
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            
            // Guardamos el perfil en el sistema central de Firebase
            await updateProfile(userCred.user, {
                displayName: nickname
            });

            // Guardamos en Firestore para que el Admin pueda verlos
            try {
                await setDoc(doc(db, "usuarios", userCred.user.uid), {
                    nombre: name,
                    nickname: nickname,
                    email: email,
                    fotoPerfil: "",
                    proveedor: "email",
                    creditos: 1,
                    plan: "gratis",
                    fechaRegistro: new Date().toISOString(),
                    uid: userCred.user.uid
                });
                console.log("✅ Usuario guardado en Firestore");
            } catch (fsErr) {
                console.error("❌ Error Firestore:", fsErr);
                alert("⚠️ Error crítico: Tu cuenta se creó pero no se pudo registrar en el panel de control. Por favor, informa al administrador. Error: " + fsErr.message);
            }

            // Guardamos localmente para este navegador
            localStorage.setItem(`nick_${userCred.user.uid}`, nickname);
            localStorage.setItem(`name_${userCred.user.uid}`, name);
            
            showMessage('success', `🎉 ¡Bienvenido/a, ${nickname}! Cuenta creada. Entrando...`);
            setTimeout(() => window.location.href = 'index.html', 1500);
        } catch (err) {
            console.error(err);
            const msgs = {
                'auth/email-already-in-use': 'Ese correo ya tiene una cuenta.',
                'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
                'auth/invalid-email': 'El correo no es válido.',
                'auth/operation-not-allowed': 'El registro con correo/contraseña no está habilitado en la consola de Firebase.'
            };
            showMessage('error', '⚠️ ' + (msgs[err.code] || 'Error: ' + err.message));
            setLoading('register-btn', false);
        }
    };
</script>

</body>
</html>
