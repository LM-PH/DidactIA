<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DidactIA - Panel Administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0F1117; color: white; font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* ── LOGIN OVERLAY ── */
        #login-overlay {
            position: fixed; inset: 0;
            background: #0F1117;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .login-card {
            background: #1C212E;
            border: 1px solid #2D3748;
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }
        .login-card img { width: 52px; border-radius: 12px; margin-bottom: 16px; }
        .login-card h2 { font-size: 20px; margin-bottom: 6px; }
        .login-card p { color: #64748B; font-size: 14px; margin-bottom: 28px; }
        .login-input {
            width: 100%; padding: 12px 16px;
            background: #0F1117; border: 1px solid #334155;
            border-radius: 8px; color: white; font-size: 14px;
            margin-bottom: 16px; outline: none;
            font-family: 'Inter', sans-serif;
        }
        .login-input:focus { border-color: #6366f1; }
        .login-btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #6366f1, #4F6EF7);
            border: none; border-radius: 8px;
            color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .login-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #FCA5A5; padding: 10px; border-radius: 8px;
            font-size: 13px; margin-bottom: 14px; display: none;
        }

        /* ── PANEL ── */
        #admin-panel { display: none; }
        .admin-header {
            background: #1C212E;
            border-bottom: 1px solid #2D3748;
            padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-header-left { display: flex; align-items: center; gap: 12px; }
        .admin-header-left img { width: 36px; border-radius: 8px; }
        .admin-header-left h1 { font-size: 18px; }
        .admin-header-left span { color: #64748B; font-size: 13px; }
        .header-actions { display: flex; gap: 10px; }
        .btn-back {
            background: transparent; border: 1px solid #334155;
            color: #94A3B8; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-size: 13px; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-logout {
            background: transparent; border: 1px solid #EF4444;
            color: #EF4444; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-size: 13px;
        }
        .admin-body { max-width: 1000px; margin: 40px auto; padding: 0 24px; }
        .stats-bar {
            background: #1C212E; border: 1px solid #2D3748;
            border-radius: 12px; padding: 20px 24px;
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 24px;
        }
        .stat-num { font-size: 32px; font-weight: 700; color: #6366f1; }
        .stat-label { color: #64748B; font-size: 14px; }
        .table-wrap {
            background: #1C212E; border: 1px solid #2D3748;
            border-radius: 12px; overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #0F1117; color: #64748B;
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.05em; padding: 14px 20px; text-align: left;
        }
        td { padding: 14px 20px; border-top: 1px solid #2D3748; font-size: 14px; }
        tr:hover td { background: #232936; }
        .badge {
            background: rgba(99,102,241,0.15);
            color: #818CF8; padding: 3px 10px; border-radius: 20px;
            font-size: 12px;
        }
        .delete-btn {
            background: rgba(239,68,68,0.1); color: #EF4444;
            border: 1px solid rgba(239,68,68,0.3);
            padding: 6px 14px; border-radius: 6px;
            cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .delete-btn:hover { background: #EF4444; color: white; }
        .empty { text-align: center; padding: 60px; color: #475569; }
        .loading { text-align: center; padding: 60px; color: #6366f1; font-size: 15px; }
    </style>
</head>
<body>

<!-- ── LOGIN OVERLAY ── -->
<div id="login-overlay">
    <div class="login-card">
        <img src="logo.png" alt="DidactIA">
        <h2>Acceso Administrativo</h2>
        <p>Panel de control exclusivo</p>
        <div class="login-error" id="login-error" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5;"></div>
        
        <button id="admin-google-btn" class="login-btn" onclick="adminGoogleLogin()" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Entrar con Google
        </button>
        
        <button id="admin-back-btn" class="btn-back" onclick="window.location.href='index.html'" style="margin-top: 15px; width: 100%; justify-content: center; display: inline-flex;">
            Volver al Chat
        </button>
    </div>
</div>

<!-- ── PANEL ── -->
<div id="admin-panel">
    <div class="admin-header">
        <div class="admin-header-left">
            <img src="logo.png" alt="DidactIA">
            <div>
                <h1>Panel de Control</h1>
                <span>Gestión de usuarios · DidactIA</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-back">← Volver al Chat</a>
            <button class="btn-logout" onclick="adminLogout()">Cerrar sesión</button>
        </div>
    </div>

    <div class="admin-body">
        <div class="stats-bar">
            <div>
                <div class="stat-num" id="user-count">—</div>
                <div class="stat-label">Docentes registrados</div>
            </div>
        </div>
        <div class="table-wrap">
            <div class="loading" id="table-loading">Cargando usuarios...</div>
            <table id="users-table" style="display:none">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Nickname</th>
                        <th>Correo</th>
                        <th>Fecha de Registro</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="users-body"></tbody>
            </table>
            <div class="empty" id="no-users" style="display:none">No hay docentes registrados aún.</div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { 
        onAuthStateChanged,
        signOut,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const ADMIN_EMAIL = "zlagustin10@gmail.com";

    // Detectar estado de autenticación
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (user.email === ADMIN_EMAIL) {
                showPanel();
            } else {
                showError("⚠️ Acceso denegado. Esta cuenta no tiene permisos de administrador.");
                await signOut(auth);
            }
        } else {
            hidePanel();
        }
    });

    window.adminGoogleLogin = async () => {
        const provider = new GoogleAuthProvider();
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';
        
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            if (user.email !== ADMIN_EMAIL) {
                showError("⚠️ Acceso denegado. Esta cuenta no tiene permisos de administrador.");
                await signOut(auth);
            }
        } catch (err) {
            console.error(err);
            showError("⚠️ Error al iniciar sesión: " + err.message);
        }
    };

    window.adminLogout = async () => {
        try {
            await signOut(auth);
            window.location.reload();
        } catch (err) {
            console.error(err);
        }
    };

    function showError(message) {
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = message;
        errorEl.style.display = 'block';
    }

    function showPanel() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadUsers();
    }

    function hidePanel() {
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('admin-panel').style.display = 'none';
    }

    async function loadUsers() {
        try {
            const user = auth.currentUser;
            if (!user || user.email !== ADMIN_EMAIL) {
                document.getElementById('table-loading').textContent = 'Se requiere autenticación de administrador.';
                return;
            }

            const idToken = await user.getIdToken();

            const res = await fetch('/api/list-users', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                }
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || 'Error al cargar usuarios');
            }

            const users = data.users;

            document.getElementById('table-loading').style.display = 'none';
            document.getElementById('user-count').textContent = users.length;

            if (users.length === 0) {
                document.getElementById('no-users').style.display = 'block';
                return;
            }

            const tbody = document.getElementById('users-body');
            tbody.innerHTML = '';
            users.forEach(u => {
                const fecha = u.fechaRegistro
                    ? new Date(u.fechaRegistro).toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' })
                    : 'N/A';
                const row = document.createElement('tr');
                row.id = `row-${u.id}`;
                row.innerHTML = `
                    <td>${u.nombre || '—'}</td>
                    <td><span class="badge">${u.nickname || '—'}</span></td>
                    <td>${u.email}</td>
                    <td>${fecha}</td>
                    <td><button class="delete-btn" onclick="removeUser('${u.id}','${u.email}')">Eliminar</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('users-table').style.display = 'table';
        } catch (err) {
            document.getElementById('table-loading').textContent = 'Error al cargar: ' + err.message;
        }
    }

    window.removeUser = async (uid, email) => {
        if (!confirm(`¿Eliminar a ${email} completamente? Se borrará de Firestore y de Firebase Authentication (ya no podrá entrar a la app).`)) return;

        try {
            const user = auth.currentUser;
            if (!user || user.email !== ADMIN_EMAIL) {
                return alert('Sesión inválida o expirada.');
            }

            const idToken = await user.getIdToken();

            const res = await fetch('/api/delete-user', {
                method: 'DELETE',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                },
                body: JSON.stringify({ uid })
            });
            const data = await res.json();

            if (!res.ok) {
                return alert('Error: ' + (data.error || 'No se pudo eliminar'));
            }

            // Quitar la fila de la tabla
            document.getElementById(`row-${uid}`)?.remove();
            const count = document.querySelectorAll('#users-body tr').length;
            document.getElementById('user-count').textContent = count;
            if (count === 0) {
                document.getElementById('users-table').style.display = 'none';
                document.getElementById('no-users').style.display = 'block';
            }
            alert(`✅ ${email} eliminado correctamente de Auth y Firestore.`);
        } catch (err) {
            alert('Error de conexión: ' + err.message);
        }
    };
</script>

</body>
</html>
